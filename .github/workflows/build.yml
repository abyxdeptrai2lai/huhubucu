name: Build Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Aliucord Plugin
        uses: Aliucord/actions/build@main
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: plugin/build/outputs/*.zip
